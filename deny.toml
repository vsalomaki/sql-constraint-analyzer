[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Only licences a dependency has; a new permissive one is added with the dependency that brings it.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.93
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl-sys", reason = "No TLS or native crypto in this tool" },
    { crate = "native-tls", reason = "No TLS or native crypto in this tool" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
