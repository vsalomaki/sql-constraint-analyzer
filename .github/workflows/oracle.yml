name: Oracle

# Started by hand: loads generated exports into Oracle Free and checks Oracle rejects what the manifests expect.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-check:
    # Same gate as every job here; a manual run always passes it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      - name: Oracle Free check
        run: scripts/oracle/check.sh
