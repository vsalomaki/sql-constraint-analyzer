
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.embark-studios]
url = "https://raw.githubusercontent.com/EmbarkStudios/rust-ecosystem/main/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[[exemptions.fastrand]]
version = "2.5.0"
criteria = "safe-to-run"

[[exemptions.float-cmp]]
version = "0.10.0"
criteria = "safe-to-run"

[[exemptions.insta]]
version = "1.49.0"
criteria = "safe-to-run"

[[exemptions.proptest]]
version = "1.12.0"
criteria = "safe-to-run"

[[exemptions.r-efi]]
version = "6.0.0"
criteria = "safe-to-run"

[[exemptions.rand_xorshift]]
version = "0.5.0"
criteria = "safe-to-run"

[[exemptions.typenum]]
version = "1.20.1"
criteria = "safe-to-deploy"
notes = "Kept on purpose (issue #35): ~41,000 lines, mostly generated type-level arithmetic with no runtime behaviour or I/O, used across the RustCrypto stack (here through hybrid-array for sha2). Elsewhere only the 1.15 -> 1.17 diffs are audited, with no full audit to build on. hybrid-array's soundness relies on its USIZE constants, which that crate's 820-size check covers."
