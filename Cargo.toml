[package]
name = "sql-constraint-analyzer"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
description = "Checks Oracle SQL exports for rows that violate the declared constraints, and fixes them"
license = "Apache-2.0"
repository = "https://github.com/vsalomaki/sql-constraint-analyzer"
publish = false
default-run = "sqlca"

[lib]
name = "sqlca"
path = "src/lib.rs"

# `doc = false`: the binary shares the library's name, and rustdoc would write both to the same place.
[[bin]]
name = "sqlca"
path = "src/main.rs"
doc = false

[[bin]]
name = "sqlca-gen"
path = "src/bin/sqlca-gen.rs"
required-features = ["gen"]
doc = false

[features]
# The test-data generator; its dependencies stay out of the analyzer.
gen = []

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "color", "suggestions"] }
encoding_rs = "0.8.44"
glob = "0.3.4"
memory-stats = { version = "1.2.0", default-features = false, features = ["always_use_statm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
terminal_size = "0.4.4"
thiserror = "2.0.21"
unicode-width = { version = "0.2", default-features = false }
xxhash-rust = { version = "0.8.19", default-features = false, features = ["xxh3"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", default-features = false }
predicates = "3.1.4"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
unimplemented = "warn"
exit = "warn"
indexing_slicing = "warn"
string_slice = "warn"
get_unwrap = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
mem_forget = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# The binaries the release workflow ships; `release` stays the perf baseline.
[profile.dist]
inherits = "release"
lto = "fat"
debug = false
strip = true
